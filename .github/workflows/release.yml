name: Release

# Pushing a tag like v1.0 builds claims-intake-agent.zip from that commit and
# attaches it to a GitHub Release. The course lessons link to
# releases/latest/download/claims-intake-agent.zip, so cut a new tag whenever
# the agent changes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        run: git archive --format=zip --prefix=claims-intake-agent/ -o claims-intake-agent.zip "$GITHUB_SHA"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" claims-intake-agent.zip --title "$GITHUB_REF_NAME" --generate-notes
